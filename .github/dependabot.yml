# Weekly dependency update PRs. npm covers the site's runtime/build deps;
# the github-actions ecosystem keeps the workflow files (deploy, lighthouse,
# a11y, links) on supported action versions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Group minor + patch bumps into one PR per ecosystem to keep the
    # review queue manageable.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # @astrojs/check currently supports TypeScript 5 and 6. Ignore the next
    # major until its language-server peer dependency adds TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
