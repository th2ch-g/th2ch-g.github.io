name: a11y check

# Run axe-core against the built site to catch accessibility regressions
# (color contrast, missing labels, ARIA misuse, etc.).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest revision of a PR needs browser validation.
concurrency:
  group: a11y-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Security regression checks
        run: npm run check:security

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-firefox-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox

      - name: Build
        run: npm run build

      # Both scripts serve dist/ on random ports and use independent browser
      # processes, so they can run concurrently on the same runner.
      - name: Run browser regression checks
        run: node scripts/run-scripts-parallel.mjs check:mobile check:a11y
