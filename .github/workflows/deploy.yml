name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, while preventing in-progress runs from being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache Playwright browser binaries so cold installs don't re-download
      # them on every deploy. Keyed on package-lock so it invalidates with
      # any Playwright version bump.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-firefox-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox

      - name: Type check
        run: npm run check

      - name: Security regression checks
        run: npm run check:security

      - name: Build
        run: npm run build

      - name: Mobile layout regression checks
        run: npm run check:mobile

      # axe-core a11y audit against the built `dist/` via Playwright. Fails
      # the job on any WCAG 2 A/AA violation so regressions are caught at PR
      # time instead of shipping. Fully local — no external service, no
      # account required. No untrusted input is interpolated into this step.
      - name: A11y check (axe-core)
        run: node scripts/check-a11y.mjs

      # Lighthouse CI against `dist/` via @lhci/cli. The assertion thresholds
      # live in `lighthouserc.json`: a11y is `error`, perf/best-practices/SEO
      # are `warn`. Fully local — no upload, no account, no external service.
      - name: Lighthouse CI
        run: npx lhci autorun --config=./lighthouserc.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
