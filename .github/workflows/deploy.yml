name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, while preventing in-progress runs from being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Type check
        run: npm run check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Security regression checks
        run: npm run check:security

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Every validation job and the deployment consume this exact build.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./dist
          include-hidden-files: true

  browsers:
    name: Browser checks (${{ matrix.engine }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      BROWSER_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Prepare browser checks
        uses: ./.github/actions/prepare-browser-checks
        with:
          browsers: ${{ matrix.engine }}

      - name: Run browser regression checks
        run: npm run check:browser-engine

  quality:
    name: Accessibility, visual consistency, and Lighthouse
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Prepare browser checks
        uses: ./.github/actions/prepare-browser-checks
        with:
          browsers: chromium firefox

      - name: Run accessibility and UI checks
        run: node scripts/run-scripts-parallel.mjs check:mobile-fixes check:consistency check:a11y

      - name: Run Lighthouse without competing browser processes
        run: npm run check:lighthouse

  deploy:
    needs: [build, browsers, quality]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
