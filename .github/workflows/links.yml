name: Link check

# Periodic dead-link sweep. Builds the static site, then lychee crawls the
# generated dist/ — verifying BOTH external URLs and internal/root-relative
# links (e.g. /privacy) against real files via --root-dir. Broken links are
# reported in a GitHub Issue (created if missing, updated otherwise). Manual
# triggers allowed for ad-hoc checks.
#
# Why build first: the previous version scanned raw .astro/.md sources, where
# (a) the brace glob '*.{md,astro,html}' matched zero files — lychee's glob
# engine has no brace expansion, so every run failed with "No links found" —
# and (b) root-relative links can't be resolved without routing info. Crawling
# built HTML with --root-dir fixes both.
on:
  schedule:
    - cron: '0 9 1 * *'  # 09:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # build-cv-pdf.mjs hard-fails under CI=true when Chromium is absent
          # (a guard so deploys never ship a missing PDF). This link-check job
          # intentionally skips Playwright — the PDF isn't needed to verify
          # links, and the deploy workflow already generates & guards it. Force
          # the soft-skip path to avoid a ~150MB browser download every month.
          CI: 'false'

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          # Crawl built output. `--root-dir dist` resolves root-relative links
          # (e.g. /privacy) to dist/ files; the relative path dodges the
          # Docker-action workspace remap. The generated cv.pdf is skipped in
          # this job, and GitHub Pages serves the root 404 route from 404.html.
          # External 401/403/429 responses commonly reject CI bots despite
          # being valid in a browser, so treat those statuses as reachable.
          args: --no-progress --max-concurrency 4 --host-concurrency 2 --host-request-interval 250ms --accept '100..=103,200..=299,401,403,429' --root-dir dist --exclude 'cv\.pdf' --exclude '/404/?$' --exclude '^https://th2ch-g\.github\.io/404/?$' './dist/**/*.html'
          fail: false

      - name: File issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # v6.0.0
        with:
          title: 'Broken links detected'
          content-filepath: ./lychee/out.md
          labels: 'broken-link,automated'

      - name: Close resolved broken-link issues
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          while read -r issue_number; do
            if [ -z "$issue_number" ]; then
              continue
            fi
            gh issue close "$issue_number" \
              --repo "$GH_REPO" \
              --comment "The latest automated link check completed without errors."
          done < <(
            gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --label broken-link \
              --label automated \
              --search '"Broken links detected" in:title' \
              --json number,title \
              --jq '.[] | select(.title == "Broken links detected") | .number'
          )
